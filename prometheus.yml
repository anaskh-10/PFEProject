global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['192.168.161.3:9187']

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets:
        - "192.168.161.4:9100"
        - "192.168.161.3:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
        - "192.168.161.3:8080"
        - "192.168.161.4:8080"

  - job_name: 'ml_service'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.161.4:5000']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
